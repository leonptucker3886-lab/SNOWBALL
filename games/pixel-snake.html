<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Pixel Snake — Arcadeline</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;background:#05010f;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;touch-action:none;user-select:none}
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#1a0b3d,#05010f);z-index:10;transition:opacity .6s}
#load .pre{letter-spacing:.4em;font-size:clamp(12px,3.5vw,20px);color:#9ef;opacity:0;animation:fi 1s .3s forwards}
#load h1{font-size:clamp(36px,11vw,90px);color:#ff3df0;text-shadow:0 0 12px #ff3df0,0 0 30px #7a2bff;margin:.3em 0 .1em;opacity:0;animation:pop .6s 1.6s forwards}
#load .tag{font-size:clamp(14px,4vw,24px);color:#7ff;opacity:0;animation:fi .8s 2.6s forwards}
#bar{width:min(70vw,420px);height:10px;border:1px solid #7ff;border-radius:6px;margin-top:2em;overflow:hidden}#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7ff,#ff3df0);animation:fill 6.2s .3s linear forwards}
#ball{position:absolute;bottom:18%;left:-60px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 0 18px #9ef;animation:roll 6.5s .3s linear forwards}
@keyframes fi{to{opacity:1}}@keyframes pop{0%{opacity:0;transform:scale(.4)}80%{transform:scale(1.1)}to{opacity:1;transform:scale(1)}}@keyframes fill{to{width:100%}}
@keyframes roll{to{left:calc(100% + 60px);width:70px;height:70px;transform:rotate(720deg)}}
#wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;padding:8px}
#hud{display:flex;gap:20px;font-weight:700;color:#7ff;font-size:clamp(14px,4vw,20px)}
canvas{background:#0b0420;border:2px solid #ff3df0;box-shadow:0 0 20px #7a2bff;border-radius:8px;max-width:96vw;max-height:72vh}
#msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#05010fcc;text-align:center;gap:12px;padding:20px}
#msg h2{color:#ff3df0;font-size:clamp(28px,8vw,52px);text-shadow:0 0 12px #ff3df0}#msg p{color:#cdf;font-size:clamp(13px,3.6vw,18px)}
button{font:inherit;font-weight:700;padding:12px 28px;border-radius:30px;border:2px solid #7ff;background:#130838;color:#7ff;font-size:18px}
</style></head><body>
<div id="load"><div class="pre">LEONLINK PRESENTS</div><h1>ARCADELINE</h1><div class="tag">Start small. Roll big.</div><div id="bar"><i></i></div><div id="ball"></div></div>
<div id="wrap"><div id="hud"><span>Score <b id="sc">0</b></span><span>Best <b id="hi">0</b></span></div><canvas id="c"></canvas></div>
<div id="msg"><h2>PIXEL SNAKE</h2><p>Swipe or use arrow keys / WASD to steer.<br>Eat the glowing pixels. Don't bite yourself or the walls.<br>Space / P to pause.</p><button id="go">PLAY</button></div>
<script>
setTimeout(()=>{const l=document.getElementById('load');l.style.opacity=0;setTimeout(()=>l.remove(),600)},7000);
const N=20,c=document.getElementById('c'),x=c.getContext('2d'),sc=document.getElementById('sc'),hiE=document.getElementById('hi'),msg=document.getElementById('msg');
let hi=+localStorage.getItem('al_snake_hi')||0;hiE.textContent=hi;
function size(){const s=Math.floor(Math.min(innerWidth*.96,innerHeight*.72)/N)*N;c.width=c.height=s}addEventListener('resize',()=>{size();draw()});size();
let snake,dir,nd,food,score,speed,timer,alive=false,paused=false;
function reset(){snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];dir={x:1,y:0};nd=dir;score=0;speed=140;sc.textContent=0;place();alive=true;paused=false;loop()}
function place(){do{food={x:Math.random()*N|0,y:Math.random()*N|0}}while(snake.some(s=>s.x==food.x&&s.y==food.y))}
function loop(){clearTimeout(timer);if(!alive)return;if(!paused)step();draw();timer=setTimeout(loop,speed)}
function step(){dir=nd;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(s=>s.x==h.x&&s.y==h.y))return over();
snake.unshift(h);if(h.x==food.x&&h.y==food.y){score++;sc.textContent=score;speed=Math.max(55,speed-4);place();navigator.vibrate&&navigator.vibrate(15)}else snake.pop()}
function draw(){const k=c.width/N;x.fillStyle='#0b0420';x.fillRect(0,0,c.width,c.width);
x.strokeStyle='#1a0e3a';for(let i=0;i<=N;i++){x.beginPath();x.moveTo(i*k,0);x.lineTo(i*k,c.width);x.moveTo(0,i*k);x.lineTo(c.width,i*k);x.stroke()}
if(!snake)return;x.shadowBlur=15;x.shadowColor='#ff3df0';x.fillStyle='#ff3df0';x.fillRect(food.x*k+3,food.y*k+3,k-6,k-6);
x.shadowColor='#7ff';snake.forEach((s,i)=>{x.fillStyle=i?'#3fd8e8':'#bff';x.fillRect(s.x*k+1,s.y*k+1,k-2,k-2)});x.shadowBlur=0;
if(paused){x.fillStyle='#fff';x.font='bold '+k*1.5+'px system-ui';x.textAlign='center';x.fillText('PAUSED',c.width/2,c.width/2)}}
function over(){alive=false;if(score>hi){hi=score;localStorage.setItem('al_snake_hi',hi);hiE.textContent=hi}
msg.innerHTML='<h2>GAME OVER</h2><p>Score '+score+' · Best '+hi+'</p><button id="go">PLAY AGAIN</button>';msg.style.display='flex';document.getElementById('go').onclick=start}
function start(){msg.style.display='none';reset()}document.getElementById('go').onclick=start;
function turn(dx,dy){if(dx==-dir.x&&dy==-dir.y)return;nd={x:dx,y:dy}}
addEventListener('keydown',e=>{const m={ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1],ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0]}[e.key];
if(m){e.preventDefault();turn(...m)}else if(e.key==' '||e.key=='p'||e.key=='P'){e.preventDefault();if(alive)paused=!paused;else if(msg.style.display!='none')start()}else if(e.key=='Enter'&&!alive)start()});
let tx,ty;addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.max(Math.abs(dx),Math.abs(dy))<20){if(alive)paused=!paused;return}
Math.abs(dx)>Math.abs(dy)?turn(Math.sign(dx),0):turn(0,Math.sign(dy))},{passive:true});
addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
draw();
</script></body></html>
