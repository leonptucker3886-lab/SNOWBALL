<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Rooftop Runner — Arcadeline</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;background:#05010f;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;touch-action:none;user-select:none}
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#1a0b3d,#05010f);z-index:10;transition:opacity .6s}
#load .pre{letter-spacing:.4em;font-size:clamp(12px,3.5vw,20px);color:#9ef;opacity:0;animation:fi 1s .3s forwards}
#load h1{font-size:clamp(36px,11vw,90px);color:#ff3df0;text-shadow:0 0 12px #ff3df0,0 0 30px #7a2bff;margin:.3em 0 .1em;opacity:0;animation:pop .6s 1.6s forwards}
#load .tag{font-size:clamp(14px,4vw,24px);color:#7ff;opacity:0;animation:fi .8s 2.6s forwards}
#bar{width:min(70vw,420px);height:10px;border:1px solid #7ff;border-radius:6px;margin-top:2em;overflow:hidden}#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7ff,#ff3df0);animation:fill 6.2s .3s linear forwards}
#ball{position:absolute;bottom:18%;left:-60px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 0 18px #9ef;animation:roll 6.5s .3s linear forwards}
@keyframes fi{to{opacity:1}}@keyframes pop{0%{opacity:0;transform:scale(.4)}80%{transform:scale(1.1)}to{opacity:1;transform:scale(1)}}@keyframes fill{to{width:100%}}
@keyframes roll{to{left:calc(100% + 60px);width:70px;height:70px;transform:rotate(720deg)}}
</style></head><body>
<div id="load"><div class="pre">LEONLINK PRESENTS</div><h1>ARCADELINE</h1><div class="tag">Start small. Roll big.</div><div id="bar"><i></i></div><div id="ball"></div></div>
<style>canvas{display:block;width:100vw;height:100vh}</style>
<canvas id="c"></canvas>
<div id="hud" style="position:fixed;top:8px;left:0;right:0;text-align:center;font:bold 16px system-ui;color:#7ff;pointer-events:none;z-index:2"></div>
<script>
let started=false;
setTimeout(()=>{const l=document.getElementById('load');l.style.opacity=0;setTimeout(()=>l.remove(),600);started=true},7000);
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,G;
function rs(){W=c.width=innerWidth;H=c.height=innerHeight;G=H*0.0011}rs();addEventListener('resize',rs);
let best=+localStorage.getItem('rooftopRunnerBest')||0,state='ready',paused=false;
let py,vy,onG,holding=false,holdT=0,roofs,speed,dist,score,stars,fx;
const PX=()=>W*0.22,PS=()=>Math.max(18,Math.min(30,H*0.04));
function reset(){roofs=[{x:0,w:W*1.2,y:H*0.7}];while(roofs[roofs.length-1].x<W*2)addRoof();py=roofs[0].y-PS();vy=0;onG=true;speed=Math.max(4,W*0.006);dist=0;score=0;stars=[];fx=[]}
function addRoof(){const l=roofs[roofs.length-1];const gap=(60+Math.random()*90)*(speed?speed/5:1)*Math.min(1.4,W/600+.5);const w=W*(0.25+Math.random()*0.45);let y=l.y+(Math.random()-.5)*H*0.22;y=Math.max(H*0.42,Math.min(H*0.85,y));const r={x:l.x+l.w+gap,w,y};roofs.push(r);if(Math.random()<.6)stars.push({x:r.x+w*Math.random(),y:y-PS()*2-Math.random()*H*0.12,t:0})}
reset();
function down(){if(!started)return;if(state!=='play'){if(state==='over')reset();state='play';paused=false;return}if(paused)return;holding=true;if(onG){vy=-H*0.018;onG=false;holdT=0}}
function up(){holding=false}
c.addEventListener('pointerdown',e=>{e.preventDefault();down()});addEventListener('pointerup',up);addEventListener('pointercancel',up);
addEventListener('keydown',e=>{if(e.repeat)return;if(e.code==='KeyP'&&state==='play'){paused=!paused;return}if(['Space','ArrowUp','KeyW','Enter'].includes(e.code)){e.preventDefault();down()}});
addEventListener('keyup',e=>{if(['Space','ArrowUp','KeyW','Enter'].includes(e.code))up()});
function step(){if(state!=='play'||paused)return;speed+=0.0015*Math.max(1,W/800);dist+=speed;
 for(const r of roofs)r.x-=speed;for(const s of stars)s.x-=speed;
 while(roofs.length&&roofs[0].x+roofs[0].w<-50)roofs.shift();while(roofs[roofs.length-1].x<W*2)addRoof();
 stars=stars.filter(s=>s.x>-30);
 if(!onG){if(holding&&holdT<14&&vy<0){vy-=G*0.6;holdT++}vy+=G*18*0.1*1.0;py+=vy}
 const ps=PS(),px=PX();const r=roofs.find(r=>px+ps>r.x&&px<r.x+r.w);
 if(r){if(onG){if(py+ps<r.y-2){}else py=r.y-ps}
  if(!onG&&vy>=0&&py+ps>=r.y&&py+ps-vy<=r.y+4){py=r.y-ps;vy=0;onG=true}
  else if(!onG&&py+ps>r.y+6&&px+ps-speed<=r.x){over()}}
 else if(onG){onG=false;vy=0}
 if(py>H)over();
 for(const s of stars)if(!s.t&&Math.abs(s.x-(px+ps/2))<ps&&Math.abs(s.y-(py+ps/2))<ps){s.t=1;score+=50;for(let i=0;i<10;i++)fx.push({x:s.x,y:s.y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,l:30})}
 stars=stars.filter(s=>!s.t);fx.forEach(f=>{f.x+=f.vx;f.y+=f.vy;f.l--});fx=fx.filter(f=>f.l>0)}
function total(){return Math.floor(dist/10)+score}
function over(){state='over';const t=total();if(t>best){best=t;localStorage.setItem('rooftopRunnerBest',best)}}
function draw(){x.fillStyle='#05010f';x.fillRect(0,0,W,H);
 x.fillStyle='#120634';for(let i=0;i<12;i++){const bw=W/8,bx=((i*bw*1.3-dist*0.2)%(W+bw*2)+W+bw*2)%(W+bw*2)-bw;const bh=H*(0.25+((i*37)%10)/30);x.fillRect(bx,H-bh,bw*0.8,bh)}
 for(const r of roofs){x.fillStyle='#1b0d40';x.fillRect(r.x,r.y,r.w,H-r.y);x.strokeStyle='#7ff';x.lineWidth=3;x.shadowColor='#7ff';x.shadowBlur=12;x.beginPath();x.moveTo(r.x,r.y);x.lineTo(r.x+r.w,r.y);x.stroke();x.shadowBlur=0}
 x.fillStyle='#ffd23d';x.shadowColor='#ffd23d';x.shadowBlur=14;for(const s of stars){x.beginPath();x.arc(s.x,s.y,PS()*0.35,0,7);x.fill()}
 const ps=PS();x.fillStyle='#ff3df0';x.shadowColor='#ff3df0';x.fillRect(PX(),py,ps,ps);x.shadowBlur=0;
 fx.forEach(f=>{x.fillStyle='rgba(255,210,61,'+f.l/30+')';x.fillRect(f.x,f.y,3,3)});
 x.fillStyle='#7ff';x.font='bold 18px system-ui';x.textAlign='center';x.fillText('Score '+total()+'   Best '+best,W/2,30);
 if(state!=='play'||paused){x.fillStyle='rgba(5,1,15,.6)';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.font='bold '+Math.min(48,W*0.08)+'px system-ui';
  x.fillText(paused?'PAUSED':state==='over'?'GAME OVER':'ROOFTOP RUNNER',W/2,H*0.4);x.font='18px system-ui';
  x.fillText(paused?'Press P to resume':'Tap / Space to '+(state==='over'?'retry':'start'),W/2,H*0.5);
  x.fillText('Tap to jump, hold for higher. Keys: Space/Up/W, P pause',W/2,H*0.56)}}
function loop(){step();draw();requestAnimationFrame(loop)}loop();
</script></body></html>
