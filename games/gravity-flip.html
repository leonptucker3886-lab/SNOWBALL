<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Gravity Flip - Arcadeline</title>
<style>
html,body{margin:0;height:100%;background:#05060f;overflow:hidden;font-family:"Courier New",monospace;color:#fff}
#s{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s}
.p{letter-spacing:.5em;font-size:2.2vmin;color:#9fdcff;opacity:0;animation:f 1s .3s forwards}
h1{font-size:12vmin;margin:.3em 0;color:#fff;text-shadow:0 0 10px #7fd8ff,0 0 30px #ff3bd4;opacity:0;transform:scale(.3);animation:r 1.2s 1.5s cubic-bezier(.2,1.6,.4,1) forwards}
.t{font-size:3vmin;color:#ff8bf0;opacity:0;animation:f 1s 3s forwards}
.b{width:50vmin;height:2.4vmin;border:2px solid #7fd8ff;border-radius:2vmin;margin-top:5vmin;overflow:hidden;box-shadow:0 0 12px #7fd8ff}
.b i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7fd8ff,#ff3bd4);animation:g 5.6s .6s linear forwards}
.ball{position:absolute;bottom:8vmin;left:-10vmin;width:4vmin;height:4vmin;border-radius:50%;background:#eaf8ff;box-shadow:0 0 15px #fff;animation:roll 6.2s .3s ease-in forwards}
@keyframes f{to{opacity:1}}@keyframes r{to{opacity:1;transform:scale(1)}}@keyframes g{to{width:100%}}
@keyframes roll{to{left:110vw;width:14vmin;height:14vmin;transform:rotate(1080deg)}}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud span{margin:0 3px}
#hud{position:fixed;top:env(safe-area-inset-top,0);left:0;right:0;display:flex;justify-content:space-between;padding:10px 14px;font-size:clamp(12px,3.6vmin,22px);text-shadow:0 0 8px #7fd8ff;pointer-events:none;z-index:2}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,6,15,.8);z-index:3;text-align:center;padding:20px;box-sizing:border-box}
#ov h2{font-size:clamp(28px,9vmin,64px);margin:0 0 10px;text-shadow:0 0 10px #7fd8ff,0 0 24px #ff3bd4}
#ov p{font-size:clamp(14px,3.6vmin,22px);color:#9fdcff;margin:6px}
#ov button{margin-top:18px;font:inherit;font-size:clamp(18px,5vmin,30px);padding:12px 30px;border-radius:30px;border:2px solid #7fd8ff;background:transparent;color:#fff;box-shadow:0 0 14px #ff3bd4}
#s{z-index:10;background:#05060f}
</style></head><body>
<div id="hud"><span id="sc">Score 0</span><span id="hi">Best 0</span></div>
<canvas id="c" style="touch-action:none"></canvas>
<div id="ov" style="display:none"><h2 id="ot">GRAVITY FLIP</h2><p id="op">Your neon cube runs by itself. Flip gravity between floor and ceiling to dodge the spikes.<br>Speed keeps rising!</p><p>Touch: tap anywhere to flip &middot; Keys: Space/Up/W to flip, P pause</p><button id="go">PLAY</button></div>
<div id="s"><div class="p">LEONLINK PRESENTS</div><h1>ARCADELINE</h1><div class="t">Start small. Roll big.</div><div class="b"><i></i></div><div class="ball"></div></div>
<script>
const $=i=>document.getElementById(i),cv=$('c'),g=cv.getContext('2d');
let st='load',W,H,R,U,score=0,best=+localStorage.getItem('gf_best')||0,p,obs,spd,dist,next,paused=false,parts=[],AC,t=0;
$('hi').textContent='Best '+best;
function size(){R=devicePixelRatio||1;W=cv.width=innerWidth*R;H=cv.height=innerHeight*R;U=Math.min(W,H)/12}
addEventListener('resize',size);size();
function beep(f,d=.08){try{AC=AC||new AudioContext();const o=AC.createOscillator(),v=AC.createGain();o.frequency.value=f;o.type='square';v.gain.value=.05;v.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(v);v.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const top=()=>H*.18,bot=()=>H*.82;
function start(){score=0;spd=5;dist=0;next=W*.6;obs=[];parts=[];paused=false;p={x:W*.22,y:bot()-U*.8,vy:0,gd:1,rot:0,ground:true};st='play';$('ov').style.display='none';beep(600)}
function flip(){if(st!=='play'||paused)return;if(p.ground){p.gd*=-1;p.ground=false;beep(p.gd>0?400:700)}}
function spawn(){const kind=Math.random(),x=W+U;const h=U*(.8+Math.random()*.7),w=U*(.8+Math.random()*1.2);
 if(kind<.42)obs.push({x,w,h,side:1});else if(kind<.84)obs.push({x,w,h,side:-1});else{obs.push({x,w,h:U*.9,side:1});obs.push({x:x+w*.5+U*4.5,w,h:U*.9,side:-1})}
 next=U*(5+Math.random()*4)*Math.max(1,spd/6)}
function over(){st='over';beep(120,.4);for(let i=0;i<30;i++)parts.push({x:p.x,y:p.y,vx:(Math.random()-.5)*U*.5,vy:(Math.random()-.5)*U*.5,l:40});
 if(score>best){best=score;localStorage.setItem('gf_best',best)}$('hi').textContent='Best '+best;
 setTimeout(()=>{$('ot').textContent='GAME OVER';$('op').innerHTML='Score '+score+'<br>Best '+best;$('go').textContent='AGAIN';$('ov').style.display='flex'},700)}
function step(){t++;if(st==='play'&&!paused){const v=spd*R*U/40;dist+=v;score=Math.floor(dist/(U*.5));spd=5+score/60;
 next-=v;if(next<=0)spawn();obs.forEach(o=>o.x-=v);obs=obs.filter(o=>o.x+o.w>-U);
 const s=U*.8;p.vy+=p.gd*U*.045;p.y+=p.vy;p.rot+=p.ground?0:p.gd*.15;
 if(p.y+s/2>=bot()){p.y=bot()-s/2;p.vy=0;if(p.gd>0)p.ground=true}
 if(p.y-s/2<=top()){p.y=top()+s/2;p.vy=0;if(p.gd<0)p.ground=true}
 if(p.ground)p.rot=Math.round(p.rot/(Math.PI/2))*(Math.PI/2);
 const m=s*.32;for(const o of obs){const y0=o.side>0?bot()-o.h:top(),y1=o.side>0?bot():top()+o.h;
  if(p.x+m>o.x+o.w*.2&&p.x-m<o.x+o.w*.8&&p.y+m>y0+o.h*.15&&p.y-m<y1-o.h*.15){over();break}}
 if(t%3==0)parts.push({x:p.x-s/2,y:p.y,vx:-U*.05,vy:0,l:15})
 $('sc').textContent='Score '+score}
 parts.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.l--});parts=parts.filter(q=>q.l>0);draw();requestAnimationFrame(step)}
function draw(){g.fillStyle='#05060f';g.fillRect(0,0,W,H);const off=(dist||0)%(U*2);
 g.strokeStyle='rgba(127,216,255,.12)';g.lineWidth=1;for(let x=-off;x<W;x+=U*2){g.beginPath();g.moveTo(x,top());g.lineTo(x,bot());g.stroke()}
 g.shadowBlur=15*R;g.shadowColor='#7fd8ff';g.strokeStyle='#7fd8ff';g.lineWidth=3*R;
 g.beginPath();g.moveTo(0,top());g.lineTo(W,top());g.moveTo(0,bot());g.lineTo(W,bot());g.stroke();
 g.shadowColor='#ff3bd4';g.fillStyle='#ff3bd4';
 for(const o of obs){g.beginPath();const n=Math.max(1,Math.round(o.w/(U*.6))),sw=o.w/n;for(let i=0;i<n;i++){const x=o.x+i*sw;
  if(o.side>0){g.moveTo(x,bot());g.lineTo(x+sw/2,bot()-o.h);g.lineTo(x+sw,bot())}else{g.moveTo(x,top());g.lineTo(x+sw/2,top()+o.h);g.lineTo(x+sw,top())}}g.fill()}
 for(const q of parts){g.globalAlpha=q.l/40;g.fillStyle='#ffe14d';g.fillRect(q.x,q.y,U*.15,U*.15)}g.globalAlpha=1;
 if(p&&st!=='over'){const s=U*.8;g.save();g.translate(p.x,p.y);g.rotate(p.rot);g.shadowColor='#5dff8f';g.fillStyle='#5dff8f';g.fillRect(-s/2,-s/2,s,s);g.fillStyle='#05060f';g.fillRect(-s/4,-s/4,s/2,s/2);g.restore()}
 g.shadowBlur=0;if(paused){g.fillStyle='#fff';g.font=(U)+'px Courier New';g.textAlign='center';g.fillText('PAUSED',W/2,H/2)}}
cv.addEventListener('pointerdown',e=>{e.preventDefault();flip()});
addEventListener('keydown',e=>{if([' ','ArrowUp','w','W'].includes(e.key)){e.preventDefault();if(st==='play')flip();else if(st!=='load'&&$('ov').style.display!=='none')start()}
 if((e.key==='p'||e.key==='P')&&st==='play')paused=!paused;if(e.key==='Enter'&&st!=='load'&&st!=='play'&&$('ov').style.display!=='none')start()});
$('go').onclick=start;
step();
setTimeout(()=>{$('s').style.opacity=0;setTimeout(()=>{$('s').remove();st='title';$('ov').style.display='flex'},800)},7000);
</script></body></html>
