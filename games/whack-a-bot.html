<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Whack-a-Bot | Arcadeline</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#05060f;overflow:hidden;font-family:"Courier New",monospace;color:#fff;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#s{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s;z-index:10;background:#05060f}
.p{letter-spacing:.5em;font-size:max(10px,2.2vmin);color:#9fdcff;opacity:0;animation:f 1s .3s forwards}
#s h1{font-size:12vmin;margin:.3em 0;text-shadow:0 0 10px #7fd8ff,0 0 30px #ff3bd4;opacity:0;transform:scale(.3);animation:r 1.2s 1.5s cubic-bezier(.2,1.6,.4,1) forwards}
.t{font-size:max(13px,3vmin);color:#ff8bf0;opacity:0;animation:f 1s 3s forwards}
.b{width:50vmin;height:2.4vmin;border:2px solid #7fd8ff;border-radius:2vmin;margin-top:5vmin;overflow:hidden;box-shadow:0 0 12px #7fd8ff}
.b i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7fd8ff,#ff3bd4);animation:g 6.2s .3s linear forwards}
.ball{position:absolute;bottom:8vmin;left:-10vmin;width:4vmin;height:4vmin;border-radius:50%;background:#eaf8ff;box-shadow:0 0 15px #fff;animation:roll 6.4s .3s ease-in forwards}
@keyframes f{to{opacity:1}}@keyframes r{to{opacity:1;transform:scale(1)}}@keyframes g{to{width:100%}}
@keyframes roll{to{left:110vw;width:14vmin;height:14vmin;transform:rotate(1080deg)}}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vmin}
#hud{display:flex;gap:4vmin;font-size:max(14px,3.6vmin);color:#9fdcff}
#hud b{color:#fff}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2.5vmin;width:min(92vw,72vh)}
.hole{position:relative;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 60%,#000 45%,#1a1440 70%,#2b1d66);box-shadow:0 0 10px #7fd8ff44;overflow:hidden;cursor:pointer}
.k{position:absolute;left:8%;top:6%;font-size:max(11px,2.2vmin);color:#7fd8ff88;z-index:2}
.bot{position:absolute;left:15%;width:70%;height:75%;top:100%;transition:top .12s}
.up .bot{top:15%}.hit .bot{opacity:.4}
.bot svg{width:100%;height:100%}
.pop{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-weight:bold;font-size:max(16px,4vmin);pointer-events:none;animation:u .6s forwards;z-index:3}
@keyframes u{to{top:-10%;opacity:0}}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#05060fdd;text-align:center;padding:4vmin;z-index:5}
#ov h2{font-size:max(28px,9vmin);margin:0;text-shadow:0 0 10px #7fd8ff,0 0 30px #ff3bd4}
#ov p{font-size:max(14px,3vmin);color:#ccd}
button{font:inherit;font-size:max(18px,4vmin);padding:2vmin 6vmin;border:2px solid #ff3bd4;border-radius:3vmin;background:#1a0a2a;color:#fff;box-shadow:0 0 15px #ff3bd4}
</style></head><body>
<div id="s"><div class="p">LEONLINK PRESENTS</div><h1>ARCADELINE</h1><div class="t">Start small. Roll big.</div><div class="b"><i></i></div><div class="ball"></div></div>
<div id="app"><div id="hud"><span>SCORE <b id="sc">0</b></span><span>TIME <b id="tm">45</b></span><span>BEST <b id="bs">0</b></span></div><div id="grid"></div></div>
<div id="ov"><h2>WHACK-A-BOT</h2><p id="msg">Tap robots before they hide. Gold = +5. Avoid red bombs (-5, -3s). Streaks multiply points.<br>Keys: Q W E / A S D / Z X C or numpad. Enter/Space to start.</p><button id="go">PLAY</button></div>
<script>
const $=id=>document.getElementById(id);
const BOT='<svg viewBox="0 0 100 100"><rect x="47" y="4" width="6" height="14" fill="#7fd8ff"/><circle cx="50" cy="5" r="5" fill="#ff3bd4"/><rect x="15" y="18" width="70" height="54" rx="12" fill="#2a3a6a" stroke="#7fd8ff" stroke-width="4"/><circle cx="36" cy="40" r="9" fill="#ff3bd4"/><circle cx="64" cy="40" r="9" fill="#ff3bd4"/><rect x="32" y="56" width="36" height="6" fill="#7fd8ff"/><rect x="25" y="72" width="50" height="28" fill="#1d2a50" stroke="#7fd8ff" stroke-width="4"/></svg>';
const GOLD=BOT.replace(/#2a3a6a/g,'#6a5410').replace(/#7fd8ff/g,'#ffd23b');
const BOMB='<svg viewBox="0 0 100 100"><circle cx="50" cy="60" r="34" fill="#300" stroke="#ff3b3b" stroke-width="5"/><path d="M50 26 Q60 8 72 12" stroke="#ffd23b" stroke-width="4" fill="none"/><text x="50" y="74" font-size="36" text-anchor="middle" fill="#ff3b3b" font-family="monospace">X</text></svg>';
const keys='qweasdzxc',num={7:0,8:1,9:2,4:3,5:4,6:5,1:6,2:7,3:8};
const holes=[];
for(let i=0;i<9;i++){const el=document.createElement('div');el.className='hole';el.innerHTML='<span class="k">'+keys[i].toUpperCase()+'</span><div class="bot"></div>';
el.addEventListener('pointerdown',e=>{e.preventDefault();whack(i)});$('grid').appendChild(el);holes.push({el,type:null,t:0})}
let score,time,run=false,combo,last,spawnT,best=+(localStorage.wabBest||0);$('bs').textContent=best;
let ac;function beep(f,d){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(1e-4,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
function pop(h,t,c){const p=document.createElement('div');p.className='pop';p.textContent=t;p.style.color=c;h.el.appendChild(p);setTimeout(()=>p.remove(),600)}
function hide(h){h.el.classList.remove('up','hit');h.type=null}
function whack(i){const h=holes[i];if(!run||!h.type||h.el.classList.contains('hit'))return;
 if(h.type==='bomb'){score=Math.max(0,score-5);time=Math.max(0,time-3);combo=0;pop(h,'-5 -3s','#ff3b3b');beep(90,.3);navigator.vibrate&&navigator.vibrate(120)}
 else{combo++;const m=1+Math.floor(combo/5),pts=(h.type==='gold'?5:1)*m;score+=pts;pop(h,'+'+pts+(m>1?' x'+m:''),h.type==='gold'?'#ffd23b':'#7fd8ff');beep(h.type==='gold'?880:520,.1)}
 h.el.classList.add('hit');setTimeout(()=>hide(h),150);$('sc').textContent=score}
function spawn(now){const free=holes.filter(h=>!h.type);if(!free.length)return;const h=free[Math.random()*free.length|0],r=Math.random(),pr=1-time/45;
 h.type=r<.12?'gold':r<.22+pr*.12?'bomb':'bot';h.el.querySelector('.bot').innerHTML=h.type==='gold'?GOLD:h.type==='bomb'?BOMB:BOT;
 h.el.classList.add('up');h.t=now+Math.max(550,1300-pr*700)}
function loop(now){if(!run)return;time-=Math.min(.1,(now-last)/1000);last=now;
 if(now>spawnT){spawn(now);if(time<30&&Math.random()<.4)spawn(now);spawnT=now+Math.max(350,900-(45-time)*12)}
 holes.forEach(h=>{if(h.type&&now>h.t&&!h.el.classList.contains('hit')){if(h.type!=='bomb')combo=0;hide(h)}});
 $('tm').textContent=Math.max(0,Math.ceil(time));if(time<=0)return end();requestAnimationFrame(loop)}
function start(){if(run)return;score=0;time=45;combo=0;holes.forEach(hide);$('sc').textContent=0;$('ov').style.display='none';run=true;last=spawnT=performance.now();requestAnimationFrame(loop)}
function end(){run=false;holes.forEach(hide);if(score>best){best=score;localStorage.wabBest=best;$('bs').textContent=best}
 $('ov').querySelector('h2').textContent='GAME OVER';$('msg').textContent='Score: '+score+'  |  Best: '+best;$('go').textContent='PLAY AGAIN';$('ov').style.display='flex'}
$('go').addEventListener('click',start);
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(!run&&(k==='enter'||k===' ')&&!$('s').isConnected)return start();
 let i=keys.indexOf(k);if(i<0&&k in num)i=num[k];if(i>=0&&k.length===1)whack(i)});
setTimeout(()=>{$('s').style.opacity=0;setTimeout(()=>$('s').remove(),800)},6200);
</script></body></html>
