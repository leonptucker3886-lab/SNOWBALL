<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Ice Hockey Pong | Arcadeline</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#05060f;overflow:hidden;font-family:"Courier New",monospace;color:#fff;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#s{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s;z-index:10;background:#05060f}
.p{letter-spacing:.5em;font-size:max(10px,2.2vmin);color:#9fdcff;opacity:0;animation:f 1s .3s forwards}
#s h1{font-size:12vmin;margin:.3em 0;text-shadow:0 0 10px #7fd8ff,0 0 30px #ff3bd4;opacity:0;transform:scale(.3);animation:r 1.2s 1.5s cubic-bezier(.2,1.6,.4,1) forwards}
.t{font-size:max(13px,3vmin);color:#ff8bf0;opacity:0;animation:f 1s 3s forwards}
.b{width:50vmin;height:2.4vmin;border:2px solid #7fd8ff;border-radius:2vmin;margin-top:5vmin;overflow:hidden;box-shadow:0 0 12px #7fd8ff}
.b i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7fd8ff,#ff3bd4);animation:g 6.2s .3s linear forwards}
.ball{position:absolute;bottom:8vmin;left:-10vmin;width:4vmin;height:4vmin;border-radius:50%;background:#eaf8ff;box-shadow:0 0 15px #fff;animation:roll 6.4s .3s ease-in forwards}
@keyframes f{to{opacity:1}}@keyframes r{to{opacity:1;transform:scale(1)}}@keyframes g{to{width:100%}}
@keyframes roll{to{left:110vw;width:14vmin;height:14vmin;transform:rotate(1080deg)}}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#05060fdd;text-align:center;padding:4vmin;z-index:5}
#ov h2{font-size:max(28px,9vmin);margin:0;text-shadow:0 0 10px #7fd8ff,0 0 30px #ff3bd4}
#ov p{font-size:max(14px,3vmin);color:#ccd;max-width:90vw}
button{font:inherit;font-size:max(18px,4vmin);padding:2vmin 6vmin;border:2px solid #ff3bd4;border-radius:3vmin;background:#1a0a2a;color:#fff;box-shadow:0 0 15px #ff3bd4}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:2vmin 4vmin;font-size:max(14px,3.2vmin);color:#9fdcff;text-shadow:0 0 8px #7fd8ff;z-index:2}
#g{position:fixed;left:50%;top:54%;transform:translate(-50%,-50%);display:grid;gap:1.6vmin}
.cd{perspective:600px;cursor:pointer}
.cd .in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.cd.o .in,.cd.m .in{transform:rotateY(180deg)}
.cd .f,.cd .k{position:absolute;inset:0;border-radius:1.6vmin;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center}
.cd .k{background:repeating-linear-gradient(45deg,#1a0a2a 0 6px,#250f3d 6px 12px);border:2px solid #ff3bd4;box-shadow:0 0 10px #ff3bd466}
.cd .f{transform:rotateY(180deg);background:#0b1430;border:2px solid #7fd8ff;box-shadow:0 0 12px #7fd8ff}
.cd.m .f{border-color:#5f5;box-shadow:0 0 16px #5f5;opacity:.75}
.cd.sel .k{border-color:#fff;box-shadow:0 0 18px #fff}
</style></head><body>
<div id="s"><div class="p">LEONLINK PRESENTS</div><h1>ARCADELINE</h1><div class="t">Start small. Roll big.</div><div class="b"><i></i></div><div class="ball"></div></div>
<div id="hud"><span id="lv">LVL 1</span><span id="tm">60</span><span id="sc">0</span></div>
<div id="g"></div>
<div id="ov"><h2 id="ttl">MEMORY MATCH</h2><p id="msg">Flip neon cards to find every pair before time runs out. Each level adds cards.<br>Touch: tap cards. Keys: arrows / WASD to move, Space or Enter to flip, P to pause.</p><button id="go">PLAY</button></div>
<script>
const $=id=>document.getElementById(id);
const IC=[['★','#ffd84a'],['♥','#ff4f8b'],['♦','#4fe3ff'],['♣','#7dff6a'],['♠','#c49bff'],['●','#ff9a3c'],['▲','#4affc8'],['■','#ff5cf0'],['✦','#fff36a'],['☾','#9fdcff'],['⚡','#ffe14a'],['✚','#ff6a6a'],['♪','#6affff'],['☀','#ffb84a'],['◆','#b0ff4a']];
const LV=[[4,3],[4,4],[5,4],[6,4],[6,5]];
let lvl=0,score=0,time=0,run=false,paused=false,cards=[],open=[],lock=false,sel=0,cols=4,rows=3,best=+(localStorage.mmBest||0),last=0,combo=0;
function layout(){const g=$('g');const aw=innerWidth*.94,ah=innerHeight*.8;const s=Math.min(aw/cols,ah/rows)*.9;g.style.gridTemplateColumns=`repeat(${cols},${s}px)`;g.style.gridAutoRows=s*1.0+'px';document.querySelectorAll('.f').forEach(f=>f.style.fontSize=s*.5+'px')}
addEventListener('resize',layout);
function build(){const L=LV[Math.min(lvl,LV.length-1)];cols=L[0];rows=L[1];if(innerHeight>innerWidth&&cols>rows){[cols,rows]=[rows,cols]}
const n=cols*rows/2;let d=[];for(let i=0;i<n;i++)d.push(i,i);for(let i=d.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[d[i],d[j]]=[d[j],d[i]]}
const g=$('g');g.innerHTML='';cards=d.map((v,i)=>{const e=document.createElement('div');e.className='cd';e.innerHTML=`<div class="in"><div class="k"></div><div class="f" style="color:${IC[v][1]};text-shadow:0 0 10px ${IC[v][1]}">${IC[v][0]}</div></div>`;e.onclick=()=>{sel=i;flip(i)};g.appendChild(e);return{v,e,m:false}});
open=[];lock=false;sel=0;time=Math.max(30,40+lvl*15-lvl*lvl);combo=0;mark();layout();hud()}
function mark(){cards.forEach((c,i)=>c.e.classList.toggle('sel',i===sel&&kbd))}
let kbd=false;
function flip(i){if(!run||paused||lock)return;const c=cards[i];if(c.m||open.includes(i))return;c.e.classList.add('o');open.push(i);
if(open.length===2){const[a,b]=open;if(cards[a].v===cards[b].v){cards[a].m=cards[b].m=true;combo++;score+=10*combo;time+=2;setTimeout(()=>{cards[a].e.classList.add('m');cards[b].e.classList.add('m')},250);open=[];if(cards.every(c=>c.m))setTimeout(win,600)}else{combo=0;lock=true;setTimeout(()=>{cards[a].e.classList.remove('o');cards[b].e.classList.remove('o');open=[];lock=false},700)}hud()}}
function win(){if(!run)return;score+=Math.ceil(time)*5;lvl++;hud();run=false;show('LEVEL CLEAR!','Time bonus added. Score: '+score+'<br>Next: a bigger grid.','NEXT LEVEL')}
function over(){run=false;if(score>best){best=score;localStorage.mmBest=best}show('TIME UP','Score: '+score+' &nbsp; Best: '+best,'PLAY AGAIN');lvl=0;score=0}
function show(t,m,b){$('ttl').textContent=t;$('msg').innerHTML=m;$('go').textContent=b;$('ov').style.display='flex'}
function hud(){$('lv').textContent='LVL '+(lvl+1);$('tm').textContent='⏱ '+Math.max(0,Math.ceil(time));$('sc').textContent=score+(combo>1?' x'+combo:'')}
function start(){$('ov').style.display='none';build();run=true;paused=false;last=performance.now()}
$('go').onclick=start;
function loop(t){const dt=Math.min(.1,(t-last)/1000);last=t;if(run&&!paused){time-=dt;if(time<=0){time=0;hud();over()}else hud()}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
if($('ov').style.display!=='none'){if(k==='enter'||k===' '){e.preventDefault();if(!$('s'))start()}return}
if(k==='p'){paused=!paused;if(paused)$('tm').textContent='PAUSED';return}
kbd=true;let r=sel/cols|0,c=sel%cols;
if(k==='arrowleft'||k==='a')c=(c+cols-1)%cols;else if(k==='arrowright'||k==='d')c=(c+1)%cols;else if(k==='arrowup'||k==='w')r=(r+rows-1)%rows;else if(k==='arrowdown'||k==='s')r=(r+1)%rows;else if(k===' '||k==='enter'){e.preventDefault();flip(sel)}else return;
e.preventDefault();sel=r*cols+c;mark()});
addEventListener('touchstart',()=>{kbd=false;mark()},{passive:true});
setTimeout(()=>{$('s').style.opacity=0;setTimeout(()=>$('s').remove(),800)},6200);
</script></body></html>
