<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Arcadeline</title>
<style>
html,body{margin:0;height:100%;background:#050505;overflow:hidden;font-family:"Courier New",monospace;color:#fff}
#s{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1s}
.p{letter-spacing:.5em;color:#ff7a1a;opacity:0;animation:f 1s .3s forwards;font-size:16px}
h1{font-size:clamp(40px,10vw,110px);margin:.2em 0;color:#ff2a2a;text-shadow:0 0 10px #ff2a2a,0 0 30px #ff7a1a;opacity:0;animation:f .6s 1.6s forwards,sh .15s 1.6s 4}
.t{color:#ffd23f;opacity:0;animation:f 1s 2.6s forwards;font-size:18px}
.b{width:min(420px,70vw);height:14px;border:2px solid #ff7a1a;margin-top:40px;box-shadow:0 0 12px #ff7a1a}
.b i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,#ff2a2a 0 14px,#ffd23f 14px 18px);animation:l 5s 1.5s linear forwards}
@keyframes f{to{opacity:1}}@keyframes l{to{width:100%}}
@keyframes sh{50%{transform:translate(4px,-3px)}}
#g{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;color:#ffd23f}
</style></head><body>
<div id="g">GAME START</div>
<div id="s"><div class="p">LEONLINK PRESENTS</div><h1>ARCADELINE</h1><div class="t">Lock and load. No continues.</div><div class="b"><i></i></div></div>
<script>setTimeout(()=>{s.style.opacity=0},6500);setTimeout(()=>{s.remove()},7000)</script>
</body></html>
