<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Astro Blaster — Arcadeline</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#05010a;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
canvas{display:block;width:100vw;height:100vh;height:100dvh}
#load{position:fixed;inset:0;z-index:10;background:radial-gradient(circle at 50% 45%,#2a0505,#05010a 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5vh;transition:opacity .6s}
#load .p{letter-spacing:.4em;font-size:clamp(12px,3.4vw,22px);color:#ffd6d6;opacity:0;animation:fi 1s .2s forwards}
#load .t{font-weight:900;font-size:clamp(38px,12vw,110px);color:#ff2b2b;text-shadow:0 0 12px #ff2b2b,0 0 34px #f00;opacity:0;animation:fl 1.2s 1.6s forwards,sh .35s 1.6s 3}
#load .g{font-size:clamp(13px,3.8vw,24px);color:#ffb347;opacity:0;animation:fi .8s 3s forwards;text-align:center;padding:0 5vw}
#bar{width:min(70vw,420px);height:14px;border:2px solid #ff2b2b;border-radius:3px;overflow:hidden;opacity:0;animation:fi .5s 3.3s forwards}
#bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,#ffb347 0 8px,#7a4a00 8px 12px);animation:fill 3.1s 3.4s linear forwards}
@keyframes fi{to{opacity:1}}@keyframes fill{to{width:100%}}
@keyframes fl{0%{opacity:0}10%{opacity:1}20%{opacity:.2}30%{opacity:1}45%{opacity:.4}60%,100%{opacity:1}}
@keyframes sh{0%,100%{transform:translate(0)}25%{transform:translate(-4px,2px)}75%{transform:translate(4px,-2px)}}
#ui{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:2vh;background:rgba(5,1,10,.75);z-index:5;text-align:center;padding:5vw}
#ui h1{font-size:clamp(32px,9vw,72px);color:#3df2ff;text-shadow:0 0 18px #3df2ff}
#ui p{font-size:clamp(14px,3.8vw,20px);color:#cfe;line-height:1.5}
#ui button{font:inherit;font-size:clamp(16px,4.5vw,24px);padding:.7em 1.6em;border:2px solid #ff3df2;background:transparent;color:#fff;border-radius:40px;box-shadow:0 0 14px #ff3df2}
</style></head><body>
<div id="load"><div class="p">LEONLINK PRESENTS</div><div class="t">ARCADELINE</div><div class="g">Lock and load. No continues.</div><div id="bar"><i></i></div></div>
<canvas id="c"></canvas>
<div id="ui"><h1 id="uh">ASTRO BLASTER</h1><p id="up">Drag anywhere to move · auto-fire<br>Keyboard: arrows/WASD to move, P to pause<br>Survive the waves. Every 5th wave is a boss.</p><button id="ub">START</button></div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d'),ui=document.getElementById('ui'),uh=document.getElementById('uh'),up=document.getElementById('up'),ub=document.getElementById('ub');let W,H,S;
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;x.setTransform(d,0,0,d,0,0);S=Math.max(.6,Math.min(W,H)/600)}
addEventListener('resize',rs);rs();
const stars=[...Array(120)].map(()=>({x:Math.random(),y:Math.random(),s:Math.random()*2+.5}));
let st='load',P,B,E,EB,FX,PU,sc,hi=+(localStorage.abHi||0),wave,lives,boss,spawnLeft,spawnT,keys={},tgt=null,off=null,shootT=0,last=0,bn={t:0,s:''};
function reset(){P={x:W/2,y:H*.85,r:16*S,inv:2,pw:0};B=[];E=[];EB=[];FX=[];PU=[];sc=0;wave=0;lives=3;boss=null;nextWave()}
function nextWave(){wave++;if(wave%5==0){boss={x:W/2,y:-80*S,r:55*S,hp:40+wave*12,mx:40+wave*12,t:0,ft:1,at:3};spawnLeft=0}else{spawnLeft=8+wave*3;spawnT=.5}bn={t:2,s:'WAVE '+wave+(wave%5==0?' — BOSS':'')}}
function boom(px,py,c,n=14){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=(Math.random()*3+1)*60*S;FX.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.6,c})}}
function spawn(){const k=Math.random()<Math.min(.15+wave*.05,.5)?1:0;E.push({x:(Math.random()*.8+.1)*W,y:-30*S,r:(k?18:14)*S,k,hp:k?3:1,t:Math.random()*6,vy:(60+wave*8+Math.random()*40)*S,ft:1+Math.random()*2})}
function hit(a,b){const dx=a.x-b.x,dy=a.y-b.y,r=a.r+b.r;return dx*dx+dy*dy<r*r}
function hurt(){if(P.inv>0)return;lives--;boom(P.x,P.y,'#3df2ff',30);P.inv=2;P.pw=0;navigator.vibrate&&navigator.vibrate(120);if(lives<=0)over()}
function over(){st='over';if(sc>hi){hi=sc;localStorage.abHi=hi}show('GAME OVER','Score '+sc+' · Best '+hi+'<br>Reached wave '+wave,'PLAY AGAIN',start)}
function show(h,p,b,f){uh.textContent=h;up.innerHTML=p;ub.textContent=b;ub.onclick=f;ui.style.display='flex'}
function start(){ui.style.display='none';reset();st='play'}
function pause(){if(st!='play')return;st='pause';show('PAUSED','Take a breath, pilot.','RESUME',()=>{ui.style.display='none';st='play';last=performance.now()})}
addEventListener('keydown',e=>{keys[e.code]=1;if(e.code.startsWith('Arrow')||e.code=='Space')e.preventDefault();if(ui.style.display=='flex'&&(e.code=='Enter'||e.code=='Space'))ub.onclick();else if(e.code=='KeyP'||e.code=='Escape')pause()});
addEventListener('keyup',e=>keys[e.code]=0);
cv.addEventListener('pointerdown',e=>{if(!P)return;off={dx:P.x-e.clientX,dy:P.y-e.clientY};tgt={x:e.clientX,y:e.clientY}});
cv.addEventListener('pointermove',e=>{if(off)tgt={x:e.clientX,y:e.clientY}});
addEventListener('pointerup',()=>{off=null;tgt=null});addEventListener('pointercancel',()=>{off=null;tgt=null});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
function eShot(sx,sy,a,v,r){EB.push({x:sx,y:sy,r:r*S,vx:Math.cos(a)*v*S,vy:Math.sin(a)*v*S})}
function upd(dt){const sp=380*S,mx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0),my=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0);P.x+=mx*sp*dt;P.y+=my*sp*dt;
if(tgt&&off){const k=Math.min(1,dt*18);P.x+=(tgt.x+off.dx-P.x)*k;P.y+=(tgt.y+off.dy-P.y)*k}
P.x=Math.max(P.r,Math.min(W-P.r,P.x));P.y=Math.max(H*.3,Math.min(H-P.r-8,P.y));P.inv-=dt;P.pw-=dt;
shootT-=dt;if(shootT<=0){shootT=P.pw>0?.1:.17;const v=-700*S;B.push({x:P.x,y:P.y-P.r,r:4*S,vx:0,vy:v});if(P.pw>0)B.push({x:P.x,y:P.y,r:4*S,vx:-130*S,vy:v},{x:P.x,y:P.y,r:4*S,vx:130*S,vy:v})}
B.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt});B=B.filter(b=>b.y>-20&&!b.dead);
if(spawnLeft>0){spawnT-=dt;if(spawnT<=0){spawn();spawnLeft--;spawnT=Math.max(.25,.9-wave*.05)}}
E.forEach(e=>{e.t+=dt;e.y+=e.vy*dt;e.x+=Math.sin(e.t*2)*(e.k?90:50)*S*dt;e.ft-=dt;if(e.k&&e.ft<=0&&e.y>0){e.ft=1.5+Math.random()*1.5;eShot(e.x,e.y,Math.atan2(P.y-e.y,P.x-e.x),220,5)}if(hit(e,P)){e.dead=1;boom(e.x,e.y,'#ff3df2');hurt()}});
if(boss){const b=boss;b.t+=dt;b.y+=(H*.18-b.y)*Math.min(1,dt);b.x=W/2+Math.sin(b.t*.8)*W*.32;b.ft-=dt;b.at-=dt;
if(b.ft<=0){b.ft=Math.max(.6,1.2-wave*.03);for(let i=-2;i<=2;i++)eShot(b.x,b.y+b.r*.6,Math.PI/2+i*.25,230,6)}
if(b.at<=0){b.at=3;const a=Math.atan2(P.y-b.y,P.x-b.x);for(let i=-1;i<=1;i++)eShot(b.x,b.y,a+i*.12,300,7)}
if(hit(b,P))hurt()}
EB.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;if(hit(b,{x:P.x,y:P.y,r:P.r*.6})){b.dead=1;hurt()}});EB=EB.filter(b=>!b.dead&&b.y<H+20&&b.y>-40&&b.x>-20&&b.x<W+20);
for(const b of B){for(const e of E)if(!e.dead&&!b.dead&&hit(b,e)){b.dead=1;if(--e.hp<=0){e.dead=1;sc+=e.k?30:10;boom(e.x,e.y,e.k?'#ffb347':'#ff3df2');if(Math.random()<.08)PU.push({x:e.x,y:e.y,r:11*S,k:Math.random()<.5?'P':'L'})}}
if(boss&&!b.dead&&hit(b,boss)){b.dead=1;boss.hp--;sc+=2;if(boss.hp<=0){boom(boss.x,boss.y,'#ff2b2b',60);sc+=500*wave/5;PU.push({x:boss.x,y:boss.y,r:11*S,k:'L'});boss=null}}}
E=E.filter(e=>!e.dead&&e.y<H+40);
PU.forEach(p=>{p.y+=120*S*dt;if(hit(p,P)){p.dead=1;if(p.k=='P')P.pw=8;else lives=Math.min(5,lives+1)}});PU=PU.filter(p=>!p.dead&&p.y<H+20);
FX.forEach(f=>{f.x+=f.vx*dt;f.y+=f.vy*dt;f.l-=dt});FX=FX.filter(f=>f.l>0);
if(!boss&&spawnLeft<=0&&!E.length)nextWave();bn.t-=dt}
function ship(px,py,r,c){x.save();x.translate(px,py);x.shadowColor=c;x.shadowBlur=15;x.strokeStyle=c;x.lineWidth=2.5;x.beginPath();x.moveTo(0,-r);x.lineTo(r*.8,r);x.lineTo(0,r*.5);x.lineTo(-r*.8,r);x.closePath();x.stroke();x.restore()}
function draw(t,dt){x.fillStyle='#05010a';x.fillRect(0,0,W,H);x.fillStyle='#fff';
stars.forEach(s=>{s.y+=s.s*.0006*(dt*60);if(s.y>1)s.y=0;x.globalAlpha=s.s/2.5;x.fillRect(s.x*W,s.y*H,s.s,s.s)});x.globalAlpha=1;
if(st=='load'||!P)return;
x.shadowBlur=10;x.fillStyle='#3df2ff';x.shadowColor='#3df2ff';B.forEach(b=>{x.fillRect(b.x-2*S,b.y-8*S,4*S,14*S)});
x.fillStyle='#ff5050';x.shadowColor='#ff5050';EB.forEach(b=>{x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill()});
E.forEach(e=>{x.save();x.translate(e.x,e.y);x.rotate(e.t);x.strokeStyle=x.shadowColor=e.k?'#ffb347':'#ff3df2';x.lineWidth=2.5;x.beginPath();const n=e.k?6:4;for(let i=0;i<=n;i++){const a=i/n*6.283;x.lineTo(Math.cos(a)*e.r,Math.sin(a)*e.r)}x.stroke();x.restore()});
if(boss){const b=boss;x.save();x.translate(b.x,b.y);x.strokeStyle=x.shadowColor='#ff2b2b';x.lineWidth=4;x.beginPath();for(let i=0;i<=8;i++){const a=i/8*6.283+b.t*.5,rr=i%2?b.r*.7:b.r;x.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}x.stroke();x.beginPath();x.arc(0,0,b.r*.3,0,7);x.stroke();x.restore();
const bw=W*.6;x.shadowBlur=0;x.fillStyle='#400';x.fillRect(W*.2,46*S+14,bw,8);x.fillStyle='#ff2b2b';x.fillRect(W*.2,46*S+14,bw*b.hp/b.mx,8)}
PU.forEach(p=>{x.strokeStyle=x.shadowColor=p.k=='P'?'#7dff4a':'#3df2ff';x.lineWidth=2;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.stroke();x.fillStyle=x.strokeStyle;x.font='bold '+(13*S)+'px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(p.k=='P'?'3':'+',p.x,p.y)});
if(!(P.inv>0&&Math.floor(t*10)%2))ship(P.x,P.y,P.r,P.pw>0?'#7dff4a':'#3df2ff');
FX.forEach(f=>{x.globalAlpha=Math.max(0,f.l/.6);x.fillStyle=x.shadowColor=f.c;x.fillRect(f.x,f.y,3*S,3*S)});x.globalAlpha=1;x.shadowBlur=0;
const fs=Math.max(14,18*S);x.font='bold '+fs+'px system-ui,sans-serif';x.textBaseline='top';x.fillStyle='#fff';x.textAlign='left';x.fillText('SCORE '+sc,12,12);x.textAlign='right';x.fillText('♥'.repeat(Math.max(0,lives))+'  W'+wave,W-12,12);
if(bn.t>0){x.globalAlpha=Math.min(1,bn.t);x.textAlign='center';x.textBaseline='middle';x.font='900 '+Math.max(24,40*S)+'px system-ui,sans-serif';x.fillStyle='#ff3df2';x.shadowColor='#ff3df2';x.shadowBlur=20;x.fillText(bn.s,W/2,H*.42);x.globalAlpha=1;x.shadowBlur=0}}
function loop(n){const dt=Math.min(.05,(n-last)/1000||0);last=n;if(st=='play')upd(dt);draw(n/1000,dt);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
setTimeout(()=>{const l=document.getElementById('load');l.style.opacity=0;setTimeout(()=>{l.remove();st='menu';show('ASTRO BLASTER',up.innerHTML+'<br>Best: '+hi,'START',start)},600)},6400);
</script></body></html>
