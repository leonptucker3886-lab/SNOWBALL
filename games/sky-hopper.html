<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>Sky Hopper — Arcadeline</title>
<style>
html,body{margin:0;height:100%;background:#05060f;overflow:hidden;font-family:"Courier New",monospace;color:#fff;touch-action:none;-webkit-user-select:none;user-select:none}
#s{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s;z-index:10;background:#05060f}
.p{letter-spacing:.5em;font-size:2.2vmin;color:#9fdcff;opacity:0;animation:f 1s .3s forwards}
h1{font-size:12vmin;margin:.3em 0;color:#fff;text-shadow:0 0 10px #7fd8ff,0 0 30px #ff3bd4;opacity:0;transform:scale(.3);animation:r 1.2s 1.5s cubic-bezier(.2,1.6,.4,1) forwards}
.t{font-size:3vmin;color:#ff8bf0;opacity:0;animation:f 1s 3s forwards}
.b{width:50vmin;height:2.4vmin;border:2px solid #7fd8ff;border-radius:2vmin;margin-top:5vmin;overflow:hidden;box-shadow:0 0 12px #7fd8ff}
.b i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7fd8ff,#ff3bd4);animation:g 5.6s .6s linear forwards}
.ball{position:absolute;bottom:8vmin;left:-10vmin;width:4vmin;height:4vmin;border-radius:50%;background:#eaf8ff;box-shadow:0 0 15px #fff;animation:roll 6.2s .3s ease-in forwards}
@keyframes f{to{opacity:1}}@keyframes r{to{opacity:1;transform:scale(1)}}@keyframes g{to{width:100%}}
@keyframes roll{to{left:110vw;width:14vmin;height:14vmin;transform:rotate(1080deg)}}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
</style></head><body>
<canvas id="c"></canvas>
<div id="s"><div class="p">LEONLINK PRESENTS</div><h1>ARCADELINE</h1><div class="t">Start small. Roll big.</div><div class="b"><i></i></div><div class="ball"></div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,D;
function rs(){D=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',rs);rs();
let st='load',bird,pipes,score,best=+localStorage.skyHopperBest||0,t0,spawn,stars=[];
for(let i=0;i<80;i++)stars.push([Math.random(),Math.random(),Math.random()*1.5+.3]);
const S=()=>Math.min(W,H)/100;
function reset(){bird={y:H/2,v:0,r:3.2*S()};pipes=[];score=0;spawn=0}
reset();
function flap(){if(st==='load')return;if(st==='ready'){st='play'}if(st==='over'){if(performance.now()-t0>500){reset();st='ready'}return}bird.v=-H*0.011}
addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW','Enter'].includes(e.code)){e.preventDefault();flap()}});
addEventListener('pointerdown',e=>{e.preventDefault();flap()},{passive:false});
setTimeout(()=>{const s=document.getElementById('s');s.style.opacity=0;st='ready';setTimeout(()=>s.remove(),800)},6200);
let last=performance.now();
function loop(n){let dt=Math.min((n-last)/16.67,3);last=n;upd(dt);draw();requestAnimationFrame(loop)}
function upd(dt){if(st!=='play'){if(st==='ready')bird.y=H/2+Math.sin(performance.now()/300)*8;return}
 const sp=W*0.0045*(1+Math.min(score,40)*0.012),gap=Math.max(H*0.24,bird.r*7),pw=Math.max(9*S(),40);
 bird.v+=H*0.0006*dt;bird.y+=bird.v*dt;spawn-=sp*dt;
 if(spawn<=0){pipes.push({x:W+pw,w:pw,g:gap,y:H*0.15+Math.random()*(H*0.7-gap),p:0});spawn=Math.max(W*0.45,pw*4.5)}
 const bx=W*0.28;
 for(const p of pipes){p.x-=sp*dt;if(!p.p&&p.x+p.w<bx){p.p=1;score++}
  if(bx+bird.r>p.x&&bx-bird.r<p.x+p.w&&(bird.y-bird.r<p.y||bird.y+bird.r>p.y+p.g))die()}
 pipes=pipes.filter(p=>p.x+p.w>-10);
 if(bird.y+bird.r>H||bird.y-bird.r<0)die()}
function die(){st='over';t0=performance.now();if(score>best){best=score;localStorage.skyHopperBest=best}if(navigator.vibrate)navigator.vibrate(80)}
function txt(s,y,sz,col){x.font='bold '+sz+'px Courier New';x.textAlign='center';x.fillStyle=col;x.shadowColor=col;x.shadowBlur=12;x.fillText(s,W/2,y);x.shadowBlur=0}
function draw(){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#05060f');g.addColorStop(1,'#1a0830');x.fillStyle=g;x.fillRect(0,0,W,H);
 const tm=performance.now()/1000;x.fillStyle='#9fdcff';for(const s of stars){x.globalAlpha=.4+.3*Math.sin(tm*2+s[0]*9);x.fillRect(((s[0]*W-tm*10*s[2])%W+W)%W,s[1]*H,s[2],s[2])}x.globalAlpha=1;
 for(const p of pipes){x.fillStyle='#ff3bd4';x.shadowColor='#ff3bd4';x.shadowBlur=15;x.fillRect(p.x,0,p.w,p.y);x.fillRect(p.x,p.y+p.g,p.w,H);x.shadowBlur=0;x.fillStyle='#2a0a2a';x.fillRect(p.x+4,0,p.w-8,p.y-4);x.fillRect(p.x+4,p.y+p.g+4,p.w-8,H)}
 const bx=W*0.28;x.save();x.translate(bx,bird.y);x.rotate(Math.max(-.5,Math.min(1.2,bird.v/(H*0.015))));
 x.fillStyle='#7fd8ff';x.shadowColor='#7fd8ff';x.shadowBlur=20;x.beginPath();x.arc(0,0,bird.r,0,7);x.fill();x.shadowBlur=0;
 x.fillStyle='#fff';x.beginPath();x.arc(bird.r*.4,-bird.r*.3,bird.r*.3,0,7);x.fill();x.fillStyle='#05060f';x.beginPath();x.arc(bird.r*.5,-bird.r*.3,bird.r*.13,0,7);x.fill();
 x.fillStyle='#ffd23b';x.beginPath();x.moveTo(bird.r*.8,0);x.lineTo(bird.r*1.5,bird.r*.2);x.lineTo(bird.r*.8,bird.r*.4);x.fill();
 x.fillStyle='#bfefff';x.beginPath();x.ellipse(-bird.r*.3,bird.r*.2,bird.r*.6,bird.r*.3,Math.sin(tm*20)*.5,0,7);x.fill();x.restore();
 const m=S();if(st==='play')txt(score,H*0.12,10*m,'#fff');
 if(st==='ready'){txt('SKY HOPPER',H*0.25,10*m,'#7fd8ff');txt('TAP / SPACE TO FLAP',H*0.7,4*m,'#ff8bf0');txt('BEST '+best,H*0.78,3.5*m,'#9fdcff')}
 if(st==='over'){txt('GAME OVER',H*0.3,10*m,'#ff3bd4');txt('SCORE '+score+'   BEST '+best,H*0.42,4.5*m,'#fff');txt('TAP / SPACE TO RETRY',H*0.7,4*m,'#7fd8ff')}}
requestAnimationFrame(loop);
</script></body></html>
