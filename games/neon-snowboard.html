<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Neon Snowboard — Arcadeline</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#05010a;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
canvas{display:block;width:100vw;height:100vh;height:100dvh}
#load{position:fixed;inset:0;z-index:10;background:radial-gradient(circle at 50% 45%,#2a0505,#05010a 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5vh;transition:opacity .6s}
#load .p{letter-spacing:.4em;font-size:clamp(12px,3.4vw,22px);color:#ffd6d6;opacity:0;animation:fi 1s .2s forwards}
#load .t{font-weight:900;font-size:clamp(38px,12vw,110px);color:#ff2b2b;text-shadow:0 0 12px #ff2b2b,0 0 34px #f00;opacity:0;animation:fl 1.2s 1.6s forwards,sh .35s 1.6s 3}
#load .g{font-size:clamp(13px,3.8vw,24px);color:#ffb347;opacity:0;animation:fi .8s 3s forwards;text-align:center;padding:0 5vw}
#bar{width:min(70vw,420px);height:14px;border:2px solid #ff2b2b;border-radius:3px;overflow:hidden;opacity:0;animation:fi .5s 3.3s forwards}
#bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,#ffb347 0 8px,#7a4a00 8px 12px);animation:fill 3.1s 3.4s linear forwards}
@keyframes fi{to{opacity:1}}@keyframes fill{to{width:100%}}
@keyframes fl{0%{opacity:0}10%{opacity:1}20%{opacity:.2}30%{opacity:1}45%{opacity:.4}60%,100%{opacity:1}}
@keyframes sh{0%,100%{transform:translate(0)}25%{transform:translate(-4px,2px)}75%{transform:translate(4px,-2px)}}
#ui{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:2vh;background:rgba(5,1,10,.75);z-index:5;text-align:center;padding:5vw}
#ui h1{font-size:clamp(32px,9vw,72px);color:#3df2ff;text-shadow:0 0 18px #3df2ff}
#ui p{font-size:clamp(14px,3.8vw,20px);color:#cfe;line-height:1.5}
#ui button{font:inherit;font-size:clamp(16px,4.5vw,24px);padding:.7em 1.6em;border:2px solid #ff3df2;background:transparent;color:#fff;border-radius:40px;box-shadow:0 0 14px #ff3df2}
</style></head><body>
<div id="load"><div class="p">LEONLINK PRESENTS</div><div class="t">ARCADELINE</div><div class="g">Lock and load. No continues.</div><div id="bar"><i></i></div></div>
<canvas id="c"></canvas>
<div id="ui"><h1 id="uh">NEON SNOWBOARD</h1><p id="up">Carve down the endless slope. Dodge trees and rocks, hit the jumps for trick points. It gets faster!<br>Phone: hold or drag left/right side to steer<br>Keyboard: Left/A and Right/D to steer, P = pause</p><button id="ub">START</button></div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d'),ui=document.getElementById('ui'),uh=document.getElementById('uh'),up=document.getElementById('up'),ub=document.getElementById('ub');
const TW=400,TH=700;let W,H,S,ox,oy,D=1;
function rs(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;S=Math.min(W/TW,H/TH);ox=(W-TW*S)/2;oy=(H-TH*S)/2}
addEventListener('resize',rs);rs();
let st='load',paused=false,hi=+(localStorage.nsHi||0),sc=0,lives=3,p,obs,spd,dist,L=false,R=false,tx=null,msg='',msgT=0,last=0,inv=0,trail=[],spawn=0;
function reset(){sc=0;lives=3;p={x:200,y:200,vx:0,air:0,spin:0};obs=[];spd=240;dist=0;inv=0;trail=[];spawn=0}
function say(m){msg=m;msgT=1.4}
function addObs(){const r=Math.random(),t=r<.55?'tree':r<.82?'rock':'jump';obs.push({t,x:30+Math.random()*340,y:740,w:t==='jump'?60:t==='tree'?16:18,hit:0})}
function step(dt){
 spd=Math.min(620,spd+dt*8);dist+=spd*dt;sc+=Math.round(spd*dt/10);
 let dir=(R?1:0)-(L?1:0);if(tx!==null)dir=Math.max(-1,Math.min(1,(tx-p.x)/40));
 if(p.air>0){p.air-=dt;p.spin+=dt*12*(dir||1);if(p.air<=0){p.air=0;const tr=Math.floor(Math.abs(p.spin)/6.28);if(tr>0){const pts=tr*250;sc+=pts;say(tr+'x SPIN +'+pts)}else say('NICE AIR +100'),sc+=100;p.spin=0}}
 else{p.vx+=(dir*900-p.vx*3)*dt}
 p.x=Math.max(14,Math.min(386,p.x+p.vx*dt));
 trail.push({x:p.x,y:p.y});trail.forEach(q=>q.y-=spd*dt);trail=trail.filter(q=>q.y>-10);
 spawn-=dt;if(spawn<=0){addObs();spawn=Math.max(.22,.7-spd/2000)*(.6+Math.random()*.8)}
 obs.forEach(o=>o.y-=spd*dt);obs=obs.filter(o=>o.y>-40);
 inv=Math.max(0,inv-dt);
 for(const o of obs){if(o.hit)continue;const dx=Math.abs(o.x-p.x),dy=Math.abs(o.y-p.y);
  if(o.t==='jump'){if(dx<o.w/2&&dy<10&&p.air===0){o.hit=1;p.air=.9}}
  else if(p.air===0&&inv===0&&dx<o.w/2+8&&dy<14){o.hit=1;lives--;inv=1.5;say('WIPEOUT!');if(lives<=0)return over()}}
}
function over(){st='over';if(sc>hi){hi=sc;localStorage.nsHi=hi}uh.textContent='GAME OVER';up.innerHTML='Score: '+sc+'<br>Best: '+hi;ub.textContent='PLAY AGAIN';ui.style.display='flex'}
function draw(){
 x.setTransform(D,0,0,D,0,0);x.shadowBlur=0;x.fillStyle='#05010a';x.fillRect(0,0,W,H);x.save();x.translate(ox,oy);x.scale(S,S);
 x.beginPath();x.rect(0,0,TW,TH);x.clip();x.fillStyle='#0a0620';x.fillRect(0,0,TW,TH);
 x.strokeStyle='rgba(61,242,255,.12)';x.lineWidth=1;const off=dist%50;for(let y=-off;y<TH;y+=50){x.beginPath();x.moveTo(0,y);x.lineTo(TW,y);x.stroke()}
 x.strokeStyle='#3df2ff';x.shadowColor='#3df2ff';x.shadowBlur=8;x.lineWidth=2;x.beginPath();trail.forEach((q,i)=>i?x.lineTo(q.x,q.y):x.moveTo(q.x,q.y));x.stroke();
 for(const o of obs){if(o.t==='tree'){x.shadowColor='#3dff8a';x.shadowBlur=12;x.fillStyle='#3dff8a';x.beginPath();x.moveTo(o.x,o.y-30);x.lineTo(o.x-16,o.y+4);x.lineTo(o.x+16,o.y+4);x.closePath();x.fill();x.fillStyle='#a06a3d';x.fillRect(o.x-3,o.y+4,6,8)}
  else if(o.t==='rock'){x.shadowColor='#ff3df2';x.shadowBlur=12;x.fillStyle='#7a2a8a';x.beginPath();x.ellipse(o.x,o.y,18,11,0,0,7);x.fill();x.strokeStyle='#ff3df2';x.stroke()}
  else{x.shadowColor='#ffe23d';x.shadowBlur=14;x.fillStyle=o.hit?'#7a6a10':'#ffe23d';x.beginPath();x.moveTo(o.x-30,o.y+8);x.lineTo(o.x+30,o.y+8);x.lineTo(o.x+22,o.y-8);x.lineTo(o.x-22,o.y-8);x.closePath();x.fill();x.fillStyle='#05010a';x.font='bold 11px system-ui';x.textAlign='center';x.fillText('JUMP',o.x,o.y+4)}}
 if(!(inv>0&&Math.floor(inv*10)%2)){x.save();const sz=1+p.air*.5;x.translate(p.x,p.y);x.scale(sz,sz);x.rotate(p.spin+(p.air?0:p.vx/900));x.shadowColor='#ffb347';x.shadowBlur=16;x.fillStyle='#ffb347';x.fillRect(-16,-4,32,8);x.fillStyle='#fff';x.beginPath();x.arc(0,-10,7,0,7);x.fill();x.restore()}
 x.shadowBlur=0;x.fillStyle='#cfe';x.font='bold 18px system-ui';x.textAlign='left';x.fillText('SCORE '+sc,14,28);x.textAlign='right';x.fillText('LIVES '+lives,386,28);
 x.textAlign='center';x.font='13px system-ui';x.fillStyle='#888';x.fillText('BEST '+hi+'   '+Math.round(spd/6)+' km/h',200,690);
 if(msgT>0){x.fillStyle='#ffe23d';x.shadowColor='#ffe23d';x.shadowBlur=14;x.font='bold 28px system-ui';x.fillText(msg,200,420)}
 if(paused){x.fillStyle='#fff';x.font='bold 40px system-ui';x.fillText('PAUSED',200,380)}
 x.restore()}
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;if(st==='play'&&!paused){step(dt);msgT-=dt}if(st!=='load'&&p)draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
function start(){reset();st='play';paused=false;ui.style.display='none'}
const K={ArrowLeft:'L',a:'L',A:'L',ArrowRight:'R',d:'R',D:'R'};
addEventListener('keydown',e=>{if(K[e.key]==='L')L=true;if(K[e.key]==='R')R=true;if((e.key===' '||e.key==='Enter')&&ui.style.display==='flex')start();if(e.key==='p'||e.key==='P')paused=!paused;e.preventDefault()});
addEventListener('keyup',e=>{if(K[e.key]==='L')L=false;if(K[e.key]==='R')R=false});
function tc(e){if(st!=='play')return;tx=e.touches.length?(e.touches[0].clientX-ox)/S:null;e.preventDefault()}
['touchstart','touchmove','touchend','touchcancel'].forEach(n=>cv.addEventListener(n,tc,{passive:false}));
ub.onclick=start;reset();
setTimeout(()=>{const l=document.getElementById('load');l.style.opacity=0;setTimeout(()=>l.remove(),600);st='menu';ui.style.display='flex'},7000);
</script></body></html>
