<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>Road Dash — Arcadeline</title>
<style>
html,body{margin:0;height:100%;background:#05060f;overflow:hidden;font-family:"Courier New",monospace;color:#fff;touch-action:none;-webkit-user-select:none;user-select:none}
#s{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s;z-index:10;background:#05060f}
.p{letter-spacing:.5em;font-size:2.2vmin;color:#9fdcff;opacity:0;animation:f 1s .3s forwards}
h1{font-size:12vmin;margin:.3em 0;color:#fff;text-shadow:0 0 10px #7fd8ff,0 0 30px #ff3bd4;opacity:0;transform:scale(.3);animation:r 1.2s 1.5s cubic-bezier(.2,1.6,.4,1) forwards}
.t{font-size:3vmin;color:#ff8bf0;opacity:0;animation:f 1s 3s forwards}
.b{width:50vmin;height:2.4vmin;border:2px solid #7fd8ff;border-radius:2vmin;margin-top:5vmin;overflow:hidden;box-shadow:0 0 12px #7fd8ff}
.b i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7fd8ff,#ff3bd4);animation:g 5.6s .6s linear forwards}
.ball{position:absolute;bottom:8vmin;left:-10vmin;width:4vmin;height:4vmin;border-radius:50%;background:#eaf8ff;box-shadow:0 0 15px #fff;animation:roll 6.2s .3s ease-in forwards}
@keyframes f{to{opacity:1}}@keyframes r{to{opacity:1;transform:scale(1)}}@keyframes g{to{width:100%}}
@keyframes roll{to{left:110vw;width:14vmin;height:14vmin;transform:rotate(1080deg)}}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
</style></head><body>
<canvas id="c"></canvas>
<div id="s"><div class="p">LEONLINK PRESENTS</div><h1>ARCADELINE</h1><div class="t">Start small. Roll big.</div><div class="b"><i></i></div><div class="ball"></div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,D,T;
const COLS=9;
function rs(){D=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);T=Math.min(W/COLS,H/11)}addEventListener('resize',rs);rs();
let st='load',rows,p,score,best=+localStorage.roadDashBest||0,cam,t0,idle;
function mkRow(i){if(i<3)return{t:'g',i};const r=Math.random(),lvl=Math.min(i/60,1);
 if(i%7==0)return{t:'g',i,trees:[...Array(COLS).keys()].filter(()=>Math.random()<.2)};
 const dir=Math.random()<.5?1:-1;
 if(r<.38){const sp=(1.2+Math.random()*1.5+lvl*2)*dir,len=1+Math.random()*1.3,gap=2.5+Math.random()*2.5-lvl;const o=[];for(let k=-2;k<COLS+2;k+=len+gap)o.push(k);return{t:'w',i,sp,len,o,col:['#ff3bd4','#ffd23b','#7fd8ff','#3bff9d'][i%4]}}
 if(r<.75){const sp=(1+Math.random()*2+lvl*2)*dir,len=dir>0&&Math.random()<.3?2.2:1.2,gap=2.5+Math.random()*3-lvl;const o=[];for(let k=-2;k<COLS+2;k+=len+gap)o.push(k);return{t:'r',i,sp,len,o,col:['#ff3bd4','#ffd23b','#7fd8ff','#ff6b3b'][i%4]}}
 if(r<.9)return{t:'g',i,trees:[...Array(COLS).keys()].filter(()=>Math.random()<.18)};
 return{t:'g',i}}
function row(i){while(rows.length<=i)rows.push(mkRow(rows.length));return rows[i]}
function reset(){rows=[];p={c:4,r:0,fx:4,fy:0,ox:0};score=0;cam=0;idle=0}
reset();
function blocked(cc,r){const R=row(r);return R.t=='g'&&R.trees&&R.trees.includes(cc)&&r>2}
function move(dx,dy){if(st=='load')return;if(st=='ready')st='play';if(st=='over'){if(performance.now()-t0>500){reset();st='ready'}return}
 let nc=Math.round(p.fx)+dx,nr=p.r+dy;if(nc<0||nc>=COLS||nr<0)return;if(blocked(nc,nr))return;
 p.c=nc;p.fx=nc;p.r=nr;idle=0;if(nr>score)score=nr}
addEventListener('keydown',e=>{const k={ArrowUp:[0,1],KeyW:[0,1],ArrowDown:[0,-1],KeyS:[0,-1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0],Space:[0,1]}[e.code];if(k){e.preventDefault();move(...k)}});
let sx,sy;addEventListener('pointerdown',e=>{e.preventDefault();sx=e.clientX;sy=e.clientY},{passive:false});
addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy,m=Math.max(Math.abs(dx),Math.abs(dy));if(m<25)move(0,1);else if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1,0);else move(0,dy<0?1:-1)});
setTimeout(()=>{const s=document.getElementById('s');s.style.opacity=0;st='ready';setTimeout(()=>s.remove(),800)},6200);
function die(){if(st!='play')return;st='over';t0=performance.now();if(score>best){best=score;localStorage.roadDashBest=best}if(navigator.vibrate)navigator.vibrate(100)}
let last=performance.now();
function loop(n){const dt=Math.min((n-last)/1000,.05);last=n;upd(dt);draw();requestAnimationFrame(loop)}
function upd(dt){for(let i=Math.max(0,p.r-8);i<p.r+14;i++){const R=row(i);if(R.o){const span=COLS+4;R.o=R.o.map(o=>{o+=R.sp*dt;if(o>COLS+2)o-=span;if(o<-2-R.len)o+=span;return o})}}
 cam+=((p.r-3)-cam)*Math.min(1,dt*8);if(st!='play')return;
 idle+=dt;const R=row(p.r);
 if(R.t=='r'){for(const o of R.o)if(p.fx+.8>o&&p.fx+.2<o+R.len)die()}
 if(R.t=='w'){let on=null;for(const o of R.o)if(p.fx+.5>o&&p.fx+.5<o+R.len)on=o;if(on===null)die();else{p.fx+=R.sp*dt;if(p.fx<-.4||p.fx>COLS-.6)die()}}
 else p.fx+=(Math.round(p.fx)-p.fx)*Math.min(1,dt*20);
 if(idle>9&&p.r<cam+1)die()}
function txt(s,y,sz,col){x.font='bold '+sz+'px Courier New';x.textAlign='center';x.fillStyle=col;x.shadowColor=col;x.shadowBlur=12;x.fillText(s,W/2,y);x.shadowBlur=0}
function draw(){x.fillStyle='#05060f';x.fillRect(0,0,W,H);const ox=(W-T*COLS)/2,vis=Math.ceil(H/T)+2;
 const Y=i=>H-(i-cam+1)*T;
 for(let i=Math.max(0,Math.floor(cam)-2);i<cam+vis;i++){const R=row(i),y=Y(i);
  x.fillStyle=R.t=='g'?'#0d2a1a':R.t=='r'?'#15151f':'#071d3a';x.fillRect(ox,y,T*COLS,T);
  if(R.t=='r'){x.strokeStyle='#ffffff33';x.setLineDash([T*.3,T*.3]);x.beginPath();x.moveTo(ox,y+T);x.lineTo(ox+T*COLS,y+T);x.stroke();x.setLineDash([]);
   for(const o of R.o){x.fillStyle=R.col;x.shadowColor=R.col;x.shadowBlur=14;x.fillRect(ox+o*T,y+T*.15,R.len*T,T*.7);x.shadowBlur=0;x.fillStyle='#fff';const hx=R.sp>0?o+R.len-.1:o;x.fillRect(ox+hx*T-1,y+T*.25,3,T*.12);x.fillRect(ox+hx*T-1,y+T*.63,3,T*.12)}}
  if(R.t=='w')for(const o of R.o){x.fillStyle='#7a4a22';x.strokeStyle=R.col;x.lineWidth=2;x.shadowColor=R.col;x.shadowBlur=8;x.fillRect(ox+o*T,y+T*.18,R.len*T,T*.64);x.strokeRect(ox+o*T,y+T*.18,R.len*T,T*.64);x.shadowBlur=0}
  if(R.trees&&i>2)for(const t of R.trees){x.fillStyle='#3bff9d';x.shadowColor='#3bff9d';x.shadowBlur=10;x.beginPath();x.arc(ox+(t+.5)*T,y+T/2,T*.35,0,7);x.fill();x.shadowBlur=0}}
 x.fillStyle='#05060f';x.fillRect(0,0,ox,H);x.fillRect(ox+T*COLS,0,ox+1,H);
 const px=ox+(p.fx+.5)*T,py=Y(p.r)+T/2;x.fillStyle=st=='over'?'#ff3bd4':'#eaf8ff';x.shadowColor='#7fd8ff';x.shadowBlur=20;x.beginPath();x.arc(px,py,T*.33,0,7);x.fill();x.shadowBlur=0;
 x.fillStyle='#05060f';x.fillRect(px-T*.12,py-T*.1,T*.06,T*.08);x.fillRect(px+T*.06,py-T*.1,T*.06,T*.08);
 const m=Math.min(W,H)/100;if(st=='play')txt(score,H*.08,8*m,'#fff');
 if(st=='ready'){txt('ROAD DASH',H*.22,10*m,'#7fd8ff');txt('TAP / SWIPE / ARROWS',H*.6,4*m,'#ff8bf0');txt('BEST '+best,H*.68,3.5*m,'#9fdcff')}
 if(st=='over'){txt('SPLAT!',H*.3,10*m,'#ff3bd4');txt('SCORE '+score+'   BEST '+best,H*.42,4.5*m,'#fff');txt('TAP / KEY TO RETRY',H*.6,4*m,'#7fd8ff')}}
requestAnimationFrame(loop);
</script></body></html>
